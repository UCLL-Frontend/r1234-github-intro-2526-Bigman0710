<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weird Food Challenges - Add</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Weird Food Challenges</h1>
      <nav><a href="stats.html">See Stats</a></nav>
    </header>

    <form id="challengeForm">
      <label for="name">Challenge naam</label>
      <input
        type="text"
        id="name"
        placeholder="For example: Ghost Pepper Wings"
        required
      />

      <label for="date">Datum</label>
      <input type="date" id="date" required />

      <label for="location">Locatie</label>
      <input
        type="text"
        id="location"
        placeholder="For example: Home, Burger King"
        required
      />

      <label for="succeeded">Gelukt?</label>
      <select id="succeeded" required>
        <option value="">Did you succeed?</option>
        <option value="yes">Yes</option>
        <option value="partial">Partial</option>
        <option value="no">No / Gave up</option>
      </select>

      <label for="painLevel">Pijnniveau (1-10)</label>
      <input
        type="number"
        id="painLevel"
        placeholder="Pain level (1-10)"
        min="1"
        max="10"
        required
      />

      <label for="cost">Kostprijs</label>
      <input
        type="number"
        id="cost"
        placeholder="How much did it cost?"
        step="0.01"
        min="0"
        required
      />

      <label for="friends">Vrienden erbij?</label>
      <select id="friends" required>
        <option value="">Friends involved?</option>
        <option value="yes">Yes</option>
        <option value="no">No, alone</option>
      </select>

      <button type="submit">Add / Update Challenge</button>
    </form>

    <h2>Your Challenges</h2>
    <ul id="challengeList"></ul>

    <script type="module" src="main.js"></script>
  </body>
</html>
